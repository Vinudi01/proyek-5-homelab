version: '3.8'

services:
  # --- 1. GATEWAY & LOAD BALANCER ---
  proxy:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - devops-net
    depends_on:
      - wp-app-1
      - wp-app-2

  # --- 2. WEB SERVERS (REDUNDANT) ---
  wp-app-1:
    image: wordpress:latest
    container_name: wp-server-1
    restart: always
    environment:
      WORDPRESS_DB_HOST: db-server
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_DB_NAME: ${DB_NAME}
    networks:
      - devops-net

  wp-app-2:
    image: wordpress:latest
    container_name: wp-server-2
    restart: always
    environment:
      WORDPRESS_DB_HOST: db-server
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASS}
      WORDPRESS_DB_NAME: ${DB_NAME}
    networks:
      - devops-net

  # --- 3. DATABASE (ISOLATED) ---
  db-server:
    image: mariadb:10.6
    container_name: database-server
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    networks:
      - devops-net

  # --- 4. CI/CD ENGINE ---
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-internal
    user: root
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-net

  # --- 5. SECURITY SCANNER (SAST) ---
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube-local
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    networks:
      - devops-net

networks:
  devops-net:

volumes:
  jenkins_home:
  sonarqube_data: